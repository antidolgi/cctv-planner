<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Видео Помощник | Проектирование CCTV</title>
    <style>
        :root {
            --bg: #1a1d23;
            --panel-bg: #252830;
            --text: #e0e0e0;
            --accent: #4a90e2;
            --danger: #e74c3c;
            --success: #2ecc71;
            --warning: #f39c12;
            --btn-bg: #333842;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex; flex-direction: column; height: 100vh; overflow: hidden;
        }
        #header {
            background: var(--panel-bg);
            padding: 8px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #333;
            font-size: 14px;
            z-index: 20;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        #header .title {
            font-weight: 700;
            font-size: 18px;
            color: var(--accent);
            letter-spacing: -0.5px;
        }
        #header .contacts {
            color: #aaa;
            font-size: 12px;
        }
        #main {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        #canvas-container {
            flex: 1;
            position: relative;
            background: #12141a;
        }
        #sidebar {
            width: 300px;
            background: var(--panel-bg);
            border-left: 1px solid #333;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 15px;
            z-index: 10;
            box-shadow: -2px 0 10px rgba(0,0,0,0.3);
        }
        #sidebar h3 {
            color: var(--accent);
            margin-bottom: 10px;
            font-size: 16px;
        }
        #toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 15px;
        }
        button {
            background: var(--btn-bg);
            color: var(--text);
            border: 1px solid #444;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s;
        }
        button:hover { background: #3a404b; border-color: #555; }
        button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
        .prop-group { margin-bottom: 15px; }
        .prop-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; }
        .prop-row input, .prop-row select { background: #1a1d23; border: 1px solid #444; color: #fff; padding: 4px 8px; border-radius: 4px; width: 80px; }
        #analysis { margin-top: 15px; background: #1a1d23; padding: 10px; border-radius: 8px; font-size: 12px; line-height: 1.6; }
        #connections { margin-top: 10px; background: #1a1d23; padding: 10px; border-radius: 8px; max-height: 200px; overflow-y: auto; font-size: 12px; }
        .badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: bold; }
        .badge-danger { background: var(--danger); color: #fff; }
        .badge-success { background: var(--success); color: #fff; }
        .badge-warning { background: var(--warning); color: #000; }
        #contextMenu {
            position: absolute; display: none; background: var(--panel-bg); border: 1px solid #444;
            border-radius: 6px; box-shadow: 0 6px 14px rgba(0,0,0,0.5); z-index: 2000;
            padding: 4px 0; min-width: 150px; font-size: 13px;
        }
        #contextMenu div { padding: 6px 12px; cursor: pointer; }
        #contextMenu div:hover { background: #3a404b; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/konva@9/konva.min.js"></script>
</head>
<body>
    <div id="header">

        </div>
        <div class="contacts">
            Разработка: Симанов Максим Александрович &nbsp;|&nbsp; 📞 89957886668 &nbsp;|&nbsp; studio817.ru

    <div id="main">

            <div id="connections">

    </div>
    <div id="contextMenu"></div>

</body>
</html>

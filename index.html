<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Видео Помощник | Проектирование CCTV</title>
    <style>
        :root { --bg:#1a1d23; --panel:#252830; --text:#e0e0e0; --accent:#4a90e2; --danger:#e74c3c; --success:#2ecc71; --warn:#f39c12; }
        * { box-sizing:border-box; margin:0; padding:0; }
        body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); display:flex; flex-direction:column; height:100vh; overflow:hidden; }
        #header { background:var(--panel); padding:8px 20px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid #333; font-size:14px; }
        #header .title { font-weight:700; font-size:18px; color:var(--accent); }
        #header .contacts { color:#aaa; font-size:12px; }
        #main { display:flex; flex:1; overflow:hidden; }
        #canvas-container { flex:1; position:relative; background:#12141a; }
        #sidebar { width:320px; background:var(--panel); border-left:1px solid #333; display:flex; flex-direction:column; overflow-y:auto; padding:15px; }
        h3 { color:var(--accent); margin-bottom:10px; font-size:16px; }
        #toolbar { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:15px; }
        button { background:#333842; color:var(--text); border:1px solid #444; padding:8px 12px; border-radius:6px; cursor:pointer; font-size:13px; display:flex; align-items:center; gap:5px; transition:all 0.2s; white-space:nowrap; }
        button:hover { background:#3a404b; }
        button.active { background:var(--accent); border-color:var(--accent); color:#fff; }
        #propContent, #analysis, #connections, #priceSection { margin-top:15px; background:#1a1d23; padding:10px; border-radius:8px; font-size:12px; line-height:1.6; }
        #contextMenu { position:absolute; display:none; background:var(--panel); border:1px solid #444; border-radius:6px; z-index:2000; padding:4px 0; min-width:150px; font-size:13px; }
        #contextMenu div { padding:6px 12px; cursor:pointer; }
        #contextMenu div:hover { background:#3a404b; }
        input, select { background:#1a1d23; border:1px solid #444; color:#fff; padding:4px 8px; border-radius:4px; }
        .cam-mass { display:flex; gap:5px; align-items:center; margin-bottom:8px; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/konva@9/konva.min.js"></script>
</head>
<body>
<div id="header">
    <div><span class="title">🎥 Видео Помощник</span><span style="margin-left:15px;color:#888;">| Проектирование систем видеонаблюдения</span></div>
    <div class="contacts">Разработка: Симанов Максим Александрович | 📞 89957886668 | studio817.ru</div>
</div>
<div id="main">
    <div id="canvas-container"></div>
    <div id="sidebar">
        <h3>🔧 Инструменты</h3>
        <div id="toolbar"></div>
        <div class="cam-mass">
            <span>Камер за раз:</span>
            <input id="massCount" type="number" value="1" min="1" max="100" style="width:60px;">
        </div>
        <div id="propContent"><strong>Свойства</strong><br>Выберите объект</div>
        <div id="priceSection">
            <strong>💰 Прайс-лист</strong><br>
            <input type="file" id="priceFileInput" accept=".csv,.txt"><br>
            <small style="color:#aaa;">Загрузите CSV (артикул,наименование,цена)</small>
            <div id="priceStatus"></div>
        </div>
        <div id="analysis"><strong>📊 Анализ</strong><div id="analysisText"></div></div>
        <div id="connections"><strong>🔗 Связи</strong><div id="connectionsList"></div></div>
        <button id="saveBtn" style="margin-top:10px;">💾 Сохранить проект</button>
        <button id="loadBtn" style="margin-top:5px;">📂 Загрузить проект</button>
    </div>
</div>
<div id="contextMenu"></div>
<script>
       (function() {
        // ---------- ИНИЦИАЛИЗАЦИЯ ----------
        const container = document.getElementById('canvas-container');
        const stage = new Konva.Stage({ container: 'canvas-container', width: container.clientWidth, height: container.clientHeight });
        const layer = new Konva.Layer(); stage.add(layer);
        window.addEventListener('resize', () => { stage.width(container.clientWidth); stage.height(container.clientHeight); layer.draw(); });

        // Глобальные переменные
        let pixelsPerMeter = 20;
        let activeTool = 'select';
        let traceMode = 'straight';
        let walls = [], cameras = [], switches = [], nvrs = [], cables = [];
        let selectedObject = null;
        let backgroundImage = null;
        let priceList = []; // [{article, name, price}]
        let massCount = 1;

        // временные
        let isDrawingWall = false, wallStart, tempWallLine, tempWallText;
        let cableStart = null;
        let rulerPoints = [], rulerLine, rulerText;
        let calibLine, calibStart;
        let rotatingCamera = null, rotateHandle = null;

        // ---------- ВСПОМОГАТЕЛЬНЫЕ ----------
        function genId() { return Math.random().toString(36).substr(2, 9); }
        function getCenter(type, id) {
            if (type === 'camera') { const c = cameras.find(c=>c.id===id); return c ? {x:c.circle.x(), y:c.circle.y()} : null; }
            if (type === 'switch') { const s = switches.find(s=>s.id===id); return s ? {x:s.rect.x()+s.rect.width()/2, y:s.rect.y()+s.rect.height()/2} : null; }
            if (type === 'nvr') { const n = nvrs.find(n=>n.id===id); return n ? {x:n.rect.x()+n.rect.width()/2, y:n.rect.y()+n.rect.height()/2} : null; }
        }
        function updateCable(cable) {
            const f = getCenter(cable.from.type, cable.from.id);
            const t = getCenter(cable.to.type, cable.to.id);
            if (!f || !t) return;
            let pts = [f.x, f.y];
            if (cable.path) cable.path.forEach(p => pts.push(p.x, p.y));
            pts.push(t.x, t.y);
            if (traceMode === 'walls' && (!cable.path || cable.path.length === 0)) {
                const path = calculateWallPath(f, t);
                if (path.length > 4) { pts = path; }
            }
            cable.line.points(pts);
        }
        function updateAllCables() { cables.forEach(updateCable); }
        function calculateWallPath(f, t) {
            if (traceMode !== 'walls') return [f.x, f.y, t.x, t.y];
            for (let w of walls) {
                const pts = w.line.points();
                if (segmentsIntersect(f.x,f.y,t.x,t.y, pts[0],pts[1],pts[2],pts[3])) {
                    const d1 = Math.hypot(f.x-pts[0],f.y-pts[1])+Math.hypot(pts[0]-t.x,pts[1]-t.y);
                    const d2 = Math.hypot(f.x-pts[2],f.y-pts[3])+Math.hypot(pts[2]-t.x,pts[3]-t.y);
                    const corner = d1<d2 ? {x:pts[0],y:pts[1]} : {x:pts[2],y:pts[3]};
                    return [f.x,f.y, corner.x,corner.y, t.x,t.y];
                }
            }
            return [f.x,f.y, t.x,t.y];
        }
        function segmentsIntersect(x1,y1,x2,y2,x3,y3,x4,y4) {
            const turn = (ax,ay,bx,by,cx,cy) => (bx-ax)*(cy-ay)-(by-ay)*(cx-ax);
            const t1=turn(x1,y1,x2,y2,x3,y3), t2=turn(x1,y1,x2,y2,x4,y4);
            const t3=turn(x3,y3,x4,y4,x1,y1), t4=turn(x3,y3,x4,y4,x2,y2);
            return (t1*t2<0) && (t3*t4<0);
        }
        function updateSidebar() {
            // общая длина с учетом лифтов
            let totalPx = 0;
            cables.forEach(c => {
                const pts = c.line.points();
                for (let i=0; i<pts.length-2; i+=2) totalPx += Math.hypot(pts[i+2]-pts[i], pts[i+3]-pts[i+1]);
                if (c.lift) totalPx += c.lift * pixelsPerMeter;
            });
            const totalM = (totalPx/pixelsPerMeter).toFixed(2);
            // проверка подключений
            let lost = 0;
            cameras.forEach(c => {
                const conn = cables.some(cb => (cb.from.type==='camera'&&cb.from.id===c.id) || (cb.to.type==='camera'&&cb.to.id===c.id));
                if (!conn) lost++;
                if (c.warning) c.warning.visible(!conn);
            });
            // рекомендации
            let recNVR = '', recSW = '';
            const cnt = cameras.length;
            if (cnt<=8) { recNVR='NVR 8-канальный'; recSW='1 свитч 8-PoE'; }
            else if (cnt<=16) { recNVR='NVR 16-канальный'; recSW='1 свитч 16-PoE'; }
            else if (cnt<=32) { recNVR='NVR 32-канальный'; recSW='2 свитча 16-PoE'; }
            else { recNVR='2 NVR (32+32)'; recSW='3 свитча 16-PoE или 24-портовый'; }
            document.getElementById('analysisText').innerHTML = `
                📏 Длина кабеля: <b>${totalM} м</b><br>
                ⚠️ Не подключено: <b>${lost}</b><br>
                💡 Рекомендация: ${recNVR}, ${recSW}
            `;
            // связи
            let html = '';
            cables.forEach((c,i) => {
                const fn = c.from.type==='camera'?'K'+(cameras.findIndex(cam=>cam.id===c.from.id)+1):(c.from.type==='switch'?'SW':'NVR');
                const tn = c.to.type==='camera'?'K'+(cameras.findIndex(cam=>cam.id===c.to.id)+1):(c.to.type==='switch'?'SW':'NVR');
                html += `<div>${fn} → ${tn}</div>`;
            });
            document.getElementById('connectionsList').innerHTML = html || 'Нет связей';
            // свойства выделенного объекта
            const prop = document.getElementById('propContent');
            if (!selectedObject) { prop.innerHTML = '<strong>Свойства</strong><br>Выберите объект'; return; }
            if (selectedObject.type==='camera') {
                const cam = cameras[selectedObject.idx];
                let opts = '<option value="">Не выбрана</option>';
                priceList.forEach(p => opts += `<option value="${p.price}">${p.name} - ${p.price} руб</option>`);
                prop.innerHTML = `<strong>Камера ${cam.name||''}</strong><br>Угол: <input id="camAngle" type="number" value="${cam.angle}" style="width:60px">°<br>Модель: <select id="camModel">${opts}</select>`;
                document.getElementById('camAngle').oninput = (e) => { cam.angle = parseFloat(e.target.value)||80; updateCameraSector(cam); layer.draw(); };
                document.getElementById('camModel').onchange = (e) => { cam.price = parseFloat(e.target.value)||0; updateSidebar(); };
            }
        }
        function updateCameraSector(cam) {
            const dist = 10;
            const half = (cam.angle/2)*Math.PI/180;
            const dPx = dist * pixelsPerMeter;
            const pts = [cam.circle.x(), cam.circle.y()];
            for (let a=-half; a<=half; a+=0.1) pts.push(cam.circle.x()+Math.cos(a+cam.direction)*dPx, cam.circle.y()+Math.sin(a+cam.direction)*dPx);
            cam.sector.points(pts);
        }

        // ---------- ИНСТРУМЕНТЫ ----------
        function buildToolbar() {
            const tools = [
                ['select','🖱️ Выбор'], ['wall','🧱 Стена'], ['camera','📷 Камера'], ['switch','🔀 Свитч'], ['nvr','🖥️ NVR'],
                ['cable','🔌 Кабель'], ['ruler','📏 Линейка'], ['delete','🗑️ Удалить'], ['calibrate','📐 Калибровка'],
                ['export','📄 КП'], ['bgBtn','🖼️ Фон']
            ];
            const tb = document.getElementById('toolbar');
            tools.forEach(([id, label]) => {
                const btn = document.createElement('button'); btn.id = id+'Btn'; btn.textContent = label;
                btn.onclick = () => setActiveTool(id);
                tb.appendChild(btn);
            });
            // фон и прозрачность
            const bgInput = document.createElement('input'); bgInput.type='range'; bgInput.id='bgOpacity'; bgInput.min='0'; bgInput.max='100'; bgInput.value='40'; bgInput.style.width='70px';
            bgInput.oninput = () => layer.draw();
            tb.appendChild(bgInput);
            const bgFile = document.createElement('input'); bgFile.type='file'; bgFile.id='bgFileInput'; bgFile.accept='image/*'; bgFile.style.display='none';
            bgFile.onchange = (e) => {
                const file = e.target.files[0]; if(!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => { const img = new Image(); img.onload = () => { backgroundImage = img; layer.draw(); }; img.src = ev.target.result; };
                reader.readAsDataURL(file);
            };
            tb.appendChild(bgFile);
            document.getElementById('bgBtn').onclick = () => bgFile.click();
        }
        function setActiveTool(tool) {
            activeTool = tool;
            document.querySelectorAll('#toolbar button').forEach(b => b.classList.remove('active'));
            const activeBtn = document.getElementById(tool+'Btn');
            if (activeBtn) activeBtn.classList.add('active');
            cableStart = null;
            if (isDrawingWall) { tempWallLine?.destroy(); tempWallText?.destroy(); isDrawingWall=false; }
            if (calibLine) { calibLine.destroy(); calibLine=null; }
            if (rulerLine) { rulerLine.destroy(); rulerText?.destroy(); rulerLine=null; rulerText=null; rulerPoints=[]; }
            clearSelection();
            layer.draw();
        }
        function clearSelection() {
            if (rotateHandle) { rotateHandle.destroy(); rotateHandle=null; }
            rotatingCamera = null;
            contextMenu.style.display='none';
            selectedObject = null;
            updateSidebar();
        }
                // ---------- ОСНОВНЫЕ ОБРАБОТЧИКИ ----------
        stage.on('click', (e) => {
            if (e.evt.button === 2) return;
            const pos = stage.getPointerPosition();
            const target = e.target;

            if (activeTool === 'camera' && target === stage) {
                massCount = parseInt(document.getElementById('massCount').value) || 1;
                const angle = 80;
                for (let i=0; i<massCount; i++) {
                    const offsetX = (i%5)*20; const offsetY = Math.floor(i/5)*20;
                    const id = genId();
                    const circle = new Konva.Circle({ x:pos.x+offsetX, y:pos.y+offsetY, radius:14, fill:'#4a90e2', stroke:'#fff', strokeWidth:2, draggable:true });
                    const text = new Konva.Text({ x:pos.x+offsetX-6, y:pos.y+offsetY-7, text:'K'+(cameras.length+1), fontSize:12, fill:'white', listening:false });
                    const sector = new Konva.Line({ fill:'rgba(255,165,0,0.2)', stroke:'orange', strokeWidth:1, closed:true, listening:false });
                    const warn = new Konva.Circle({ x:pos.x+offsetX+10, y:pos.y+offsetY-10, radius:5, fill:'red', visible:false, listening:false });
                    layer.add(sector); layer.add(circle); layer.add(text); layer.add(warn);
                    const cam = { id, circle, text, sector, angle, direction:0, warning:warn, name:'K'+(cameras.length+1), price:0 };
                    updateCameraSector(cam);
                    cameras.push(cam);
                    circle.on('dragmove', () => {
                        text.position({ x:circle.x()-6, y:circle.y()-7 });
                        warn.position({ x:circle.x()+10, y:circle.y()-10 });
                        updateCameraSector(cam);
                        updateAllCables();
                        layer.batchDraw(); updateSidebar();
                    });
                    circle.on('click', () => { selectedObject = {type:'camera', idx:cameras.indexOf(cam)}; updateSidebar(); });
                }
                layer.draw(); updateSidebar(); setActiveTool('select');
            }
            else if (activeTool === 'switch' && target === stage) {
                const id = genId();
                const rect = new Konva.Rect({ x:pos.x-20, y:pos.y-10, width:40, height:20, fill:'#2ecc71', stroke:'#fff', strokeWidth:2, draggable:true });
                const text = new Konva.Text({ x:pos.x-12, y:pos.y-7, text:'SW'+(switches.length+1), fontSize:11, fill:'white', listening:false });
                layer.add(rect); layer.add(text);
                switches.push({ id, rect, text });
                rect.on('dragmove', () => { text.position({ x:rect.x()+8, y:rect.y()+3 }); updateAllCables(); layer.batchDraw(); updateSidebar(); });
                layer.draw(); updateSidebar(); setActiveTool('select');
            }
            else if (activeTool === 'nvr' && target === stage) {
                const id = genId();
                const rect = new Konva.Rect({ x:pos.x-25, y:pos.y-15, width:50, height:30, fill:'#f39c12', stroke:'#fff', strokeWidth:2, draggable:true });
                const text = new Konva.Text({ x:pos.x-15, y:pos.y-8, text:'NVR', fontSize:12, fill:'white', listening:false });
                layer.add(rect); layer.add(text);
                nvrs.push({ id, rect, text });
                rect.on('dragmove', () => { text.position({ x:rect.x()+8, y:rect.y()+8 }); updateAllCables(); layer.batchDraw(); updateSidebar(); });
                layer.draw(); updateSidebar(); setActiveTool('select');
            }
            else if (activeTool === 'cable') {
                let found = null;
                for (let c of cameras) if (c.circle === target) { found = {type:'camera', id:c.id}; break; }
                for (let s of switches) if (s.rect === target) { found = {type:'switch', id:s.id}; break; }
                for (let n of nvrs) if (n.rect === target) { found = {type:'nvr', id:n.id}; break; }
                if (!found) return;
                if (!cableStart) { cableStart = found; }
                else {
                    if (cableStart.type === found.type && cableStart.id === found.id) { cableStart = null; return; }
                    const f = getCenter(cableStart.type, cableStart.id);
                    const t = getCenter(found.type, found.id);
                    const line = new Konva.Line({ stroke:'#e74c3c', strokeWidth:2 });
                    const cableObj = { id:genId(), line, from:cableStart, to:found, path:[], lift:0 };
                    updateCable(cableObj);
                    layer.add(line);
                    cables.push(cableObj);
                    line.on('dblclick', (ev) => {
                        const mp = stage.getPointerPosition();
                        const height = prompt('Добавить точку:\nВведите высоту подъёма (м) для этой точки (0 - без подъёма):', '0');
                        if (height !== null) {
                            const h = parseFloat(height) || 0;
                            cableObj.path.push({x:mp.x, y:mp.y, height:h});
                            if (h > 0) cableObj.lift = (cableObj.lift||0) + h;
                            updateCable(cableObj);
                            layer.draw(); updateSidebar();
                        }
                    });
                    cableStart = null; setActiveTool('select');
                    layer.draw(); updateSidebar();
                }
            }
            else if (activeTool === 'ruler') {
                if (rulerPoints.length === 0) { rulerPoints[0] = pos; }
                else {
                    rulerPoints[1] = pos;
                    if (rulerLine) { rulerLine.destroy(); rulerText.destroy(); }
                    const dist = Math.hypot(pos.x-rulerPoints[0].x, pos.y-rulerPoints[0].y);
                    rulerLine = new Konva.Line({ points:[rulerPoints[0].x, rulerPoints[0].y, pos.x, pos.y], stroke:'#f39c12', strokeWidth:2, dash:[10,5] });
                    rulerText = new Konva.Text({ x:(rulerPoints[0].x+pos.x)/2, y:(rulerPoints[0].y+pos.y)/2-10, text:`${(dist/pixelsPerMeter).toFixed(2)} м`, fontSize:14, fill:'#f39c12' });
                    layer.add(rulerLine); layer.add(rulerText); layer.draw();
                    rulerPoints = [];
                }
            }
            else if (activeTool === 'delete') {
                // камеры
                for (let i=cameras.length-1; i>=0; i--) {
                    if (cameras[i].circle === target) {
                        cameras[i].circle.destroy(); cameras[i].text.destroy(); cameras[i].sector.destroy(); cameras[i].warning.destroy();
                        cables = cables.filter(c => !(c.from.type==='camera'&&c.from.id===cameras[i].id) && !(c.to.type==='camera'&&c.to.id===cameras[i].id));
                        cameras.splice(i,1);
                        layer.draw(); updateSidebar(); return;
                    }
                }
                // свитчи
                for (let i=switches.length-1; i>=0; i--) {
                    if (switches[i].rect === target) {
                        switches[i].rect.destroy(); switches[i].text.destroy();
                        cables = cables.filter(c => !(c.from.type==='switch'&&c.from.id===switches[i].id) && !(c.to.type==='switch'&&c.to.id===switches[i].id));
                        switches.splice(i,1);
                        layer.draw(); updateSidebar(); return;
                    }
                }
                // NVR
                for (let i=nvrs.length-1; i>=0; i--) {
                    if (nvrs[i].rect === target) {
                        nvrs[i].rect.destroy(); nvrs[i].text.destroy();
                        cables = cables.filter(c => !(c.from.type==='nvr'&&c.from.id===nvrs[i].id) && !(c.to.type==='nvr'&&c.to.id===nvrs[i].id));
                        nvrs.splice(i,1);
                        layer.draw(); updateSidebar(); return;
                    }
                }
                // стены
                for (let i=walls.length-1; i>=0; i--) {
                    if (walls[i].line === target) {
                        walls[i].line.destroy(); walls[i].text.destroy(); walls[i].handles.forEach(h=>h.destroy());
                        walls.splice(i,1); layer.draw(); return;
                    }
                }
                // кабели
                for (let i=cables.length-1; i>=0; i--) {
                    if (cables[i].line === target) {
                        cables[i].line.destroy(); cables.splice(i,1); layer.draw(); updateSidebar(); return;
                    }
                }
            }
        });

        // Правый клик и контекстное меню
        const contextMenu = document.getElementById('contextMenu');
        stage.on('contextmenu', (e) => {
            e.evt.preventDefault();
            const target = e.target;
            contextMenu.innerHTML = '';
            // камера
            for (let i=0; i<cameras.length; i++) {
                if (cameras[i].circle === target) {
                    const rotBtn = document.createElement('div'); rotBtn.textContent = 'Повернуть';
                    rotBtn.onclick = () => {
                        rotatingCamera = cameras[i];
                        const half = (rotatingCamera.angle/2)*Math.PI/180;
                        if (rotateHandle) rotateHandle.destroy();
                        rotateHandle = new Konva.Circle({ x:rotatingCamera.circle.x()+Math.cos(rotatingCamera.direction+half)*10*pixelsPerMeter, y:rotatingCamera.circle.y()+Math.sin(rotatingCamera.direction+half)*10*pixelsPerMeter, radius:6, fill:'red', draggable:true });
                        rotateHandle.on('dragmove', () => {
                            const dx = rotateHandle.x() - rotatingCamera.circle.x();
                            const dy = rotateHandle.y() - rotatingCamera.circle.y();
                            rotatingCamera.direction = Math.atan2(dy,dx) - (rotatingCamera.angle/2)*Math.PI/180;
                            updateCameraSector(rotatingCamera);
                            const newHalf = (rotatingCamera.angle/2)*Math.PI/180;
                            rotateHandle.position({ x:rotatingCamera.circle.x()+Math.cos(rotatingCamera.direction+newHalf)*10*pixelsPerMeter, y:rotatingCamera.circle.y()+Math.sin(rotatingCamera.direction+newHalf)*10*pixelsPerMeter });
                            layer.batchDraw();
                        });
                        layer.add(rotateHandle); layer.draw();
                        contextMenu.style.display = 'none';
                    };
                    contextMenu.appendChild(rotBtn);
                    const delBtn = document.createElement('div'); delBtn.textContent = 'Удалить';
                    delBtn.onclick = () => { cameras[i].circle.destroy(); cameras[i].text.destroy(); cameras[i].sector.destroy(); cameras[i].warning.destroy(); cameras.splice(i,1); layer.draw(); updateSidebar(); contextMenu.style.display='none'; };
                    contextMenu.appendChild(delBtn);
                    contextMenu.style.display = 'block';
                    contextMenu.style.left = e.evt.clientX + 'px';
                    contextMenu.style.top = e.evt.clientY + 'px';
                    return;
                }
            }
            // стена
            for (let i=0; i<walls.length; i++) {
                if (walls[i].line === target) {
                    const delBtn = document.createElement('div'); delBtn.textContent = 'Удалить';
                    delBtn.onclick = () => { walls[i].line.destroy(); walls[i].text.destroy(); walls[i].handles.forEach(h=>h.destroy()); walls.splice(i,1); layer.draw(); contextMenu.style.display='none'; };
                    contextMenu.appendChild(delBtn);
                    contextMenu.style.display = 'block';
                    contextMenu.style.left = e.evt.clientX + 'px';
                    contextMenu.style.top = e.evt.clientY + 'px';
                    return;
                }
            }
        });
        // Shift+колесо для вращения
        stage.on('wheel', (e) => {
            if (!rotatingCamera || !e.evt.shiftKey) return;
            e.evt.preventDefault();
            rotatingCamera.direction += e.evt.deltaY > 0 ? -0.05 : 0.05;
            updateCameraSector(rotatingCamera);
            if (rotateHandle) {
                const half = (rotatingCamera.angle/2)*Math.PI/180;
                rotateHandle.position({ x:rotatingCamera.circle.x()+Math.cos(rotatingCamera.direction+half)*10*pixelsPerMeter, y:rotatingCamera.circle.y()+Math.sin(rotatingCamera.direction+half)*10*pixelsPerMeter });
            }
            layer.batchDraw();
        });
                // Рисование стен
        stage.on('mousedown', (e) => {
            if (activeTool !== 'wall' || e.target !== stage) return;
            isDrawingWall = true;
            const pos = stage.getPointerPosition();
            wallStart = pos;
            tempWallLine = new Konva.Line({ points:[pos.x,pos.y,pos.x,pos.y], stroke:'#4a90e2', strokeWidth:2, dash:[10,5] });
            tempWallText = new Konva.Text({ x:pos.x+5, y:pos.y-15, text:'0 м', fontSize:14, fill:'#4a90e2' });
            layer.add(tempWallLine); layer.add(tempWallText);
        });
        stage.on('mousemove', () => {
            if (!isDrawingWall || activeTool !== 'wall') return;
            const pos = stage.getPointerPosition();
            tempWallLine.points([wallStart.x, wallStart.y, pos.x, pos.y]);
            const len = Math.hypot(pos.x-wallStart.x, pos.y-wallStart.y);
            tempWallText.text(`${(len/pixelsPerMeter).toFixed(2)} м`);
            tempWallText.position({ x:(wallStart.x+pos.x)/2+5, y:(wallStart.y+pos.y)/2-15 });
            layer.batchDraw();
        });
        stage.on('mouseup', () => {
            if (!isDrawingWall || activeTool !== 'wall') return;
            isDrawingWall = false;
            const pos = stage.getPointerPosition();
            tempWallLine.destroy(); tempWallText.destroy();
            const dx = pos.x - wallStart.x, dy = pos.y - wallStart.y;
            if (Math.abs(dx)<5 && Math.abs(dy)<5) { layer.draw(); return; }
            const line = new Konva.Line({ points:[wallStart.x, wallStart.y, pos.x, pos.y], stroke:'#aaa', strokeWidth:4 });
            const text = new Konva.Text({ fontSize:14, fill:'#f39c12', listening:false });
            const h1 = new Konva.Circle({ x:wallStart.x, y:wallStart.y, radius:6, fill:'#e74c3c', draggable:true });
            const h2 = new Konva.Circle({ x:pos.x, y:pos.y, radius:6, fill:'#e74c3c', draggable:true });
            const wallObj = { id:genId(), line, text, handles:[h1,h2] };
            const updateWall = () => {
                const pts = wallObj.line.points();
                pts[0]=h1.x(); pts[1]=h1.y(); pts[2]=h2.x(); pts[3]=h2.y();
                wallObj.line.points(pts);
                const lenPx = Math.hypot(pts[2]-pts[0], pts[3]-pts[1]);
                wallObj.text.text(`${(lenPx/pixelsPerMeter).toFixed(2)} м`);
                wallObj.text.position({ x:(pts[0]+pts[2])/2-20, y:(pts[1]+pts[3])/2-20 });
                layer.batchDraw();
                updateAllCables(); updateSidebar();
            };
            h1.on('dragmove', updateWall); h2.on('dragmove', updateWall);
            layer.add(line); layer.add(text); layer.add(h1); layer.add(h2);
            walls.push(wallObj); updateWall(); layer.draw();
        });

        // Калибровка
        document.getElementById('calibrateBtn').addEventListener('click', () => {
            if (calibLine) {
                const pts = calibLine.points();
                const lenPx = Math.hypot(pts[2]-pts[0], pts[3]-pts[1]);
                const realM = parseFloat(prompt('Введите реальную длину линии в метрах:', '1'));
                if (realM && realM > 0) {
                    pixelsPerMeter = lenPx / realM;
                    updateAllCables(); updateSidebar(); layer.draw();
                }
                calibLine.destroy(); calibLine=null; calibStart=null;
                setActiveTool('select');
            }
        });
        stage.on('mousedown', (e) => {
            if (activeTool !== 'calibrate' || e.target !== stage) return;
            calibStart = stage.getPointerPosition();
            calibLine = new Konva.Line({ points:[calibStart.x,calibStart.y,calibStart.x,calibStart.y], stroke:'#f1c40f', strokeWidth:2, dash:[5,5] });
            layer.add(calibLine);
        });
        stage.on('mousemove', () => {
            if (!calibLine || activeTool !== 'calibrate') return;
            const pos = stage.getPointerPosition();
            calibLine.points([calibStart.x, calibStart.y, pos.x, pos.y]);
            layer.batchDraw();
        });
        stage.on('mouseup', () => {});

        // Фон
        layer.on('draw', () => {
            if (!backgroundImage) return;
            const ctx = layer.getContext();
            ctx.save();
            ctx.globalAlpha = (document.getElementById('bgOpacity').value / 100) || 0.4;
            ctx.drawImage(backgroundImage, 0, 0, stage.width(), stage.height());
            ctx.restore();
        });

        // Сохранение/Загрузка проекта
        document.getElementById('saveBtn').addEventListener('click', () => {
            const state = {
                pixelsPerMeter,
                walls: walls.map(w => ({ x1: w.line.points()[0], y1: w.line.points()[1], x2: w.line.points()[2], y2: w.line.points()[3] })),
                cameras: cameras.map(c => ({ x: c.circle.x(), y: c.circle.y(), angle: c.angle, direction: c.direction, name: c.name, price: c.price })),
                switches: switches.map(s => ({ x: s.rect.x(), y: s.rect.y() })),
                nvrs: nvrs.map(n => ({ x: n.rect.x(), y: n.rect.y() })),
                cables: cables.map(c => ({ from: c.from, to: c.to, path: c.path, lift: c.lift }))
            };
            localStorage.setItem('cctv-project', JSON.stringify(state));
            alert('Проект сохранён!');
        });
        document.getElementById('loadBtn').addEventListener('click', () => {
            const json = localStorage.getItem('cctv-project');
            if (!json) { alert('Нет сохранённого проекта.'); return; }
            const state = JSON.parse(json);
            layer.destroyChildren();
            walls = []; cameras = []; switches = []; nvrs = []; cables = [];
            pixelsPerMeter = state.pixelsPerMeter || 20;
            state.walls.forEach(w => {
                const line = new Konva.Line({ points:[w.x1,w.y1,w.x2,w.y2], stroke:'#aaa', strokeWidth:4 });
                const text = new Konva.Text({ fontSize:14, fill:'#f39c12' });
                const h1 = new Konva.Circle({ x:w.x1, y:w.y1, radius:6, fill:'#e74c3c', draggable:true });
                const h2 = new Konva.Circle({ x:w.x2, y:w.y2, radius:6, fill:'#e74c3c', draggable:true });
                const wallObj = { id:genId(), line, text, handles:[h1,h2] };
                const updateWall = () => {
                    const pts = wallObj.line.points();
                    pts[0]=h1.x(); pts[1]=h1.y(); pts[2]=h2.x(); pts[3]=h2.y();
                    wallObj.line.points(pts);
                    const lenPx = Math.hypot(pts[2]-pts[0], pts[3]-pts[1]);
                    wallObj.text.text(`${(lenPx/pixelsPerMeter).toFixed(2)} м`);
                    wallObj.text.position({ x:(pts[0]+pts[2])/2-20, y:(pts[1]+pts[3])/2-20 });
                    layer.batchDraw();
                    updateAllCables(); updateSidebar();
                };
                h1.on('dragmove', updateWall); h2.on('dragmove', updateWall);
                layer.add(line); layer.add(text); layer.add(h1); layer.add(h2);
                walls.push(wallObj); updateWall();
            });
            state.cameras.forEach(c => {
                const circle = new Konva.Circle({ x:c.x, y:c.y, radius:14, fill:'#4a90e2', stroke:'#fff', strokeWidth:2, draggable:true });
                const text = new Konva.Text({ x:c.x-6, y:c.y-7, text:c.name||'K'+(cameras.length+1), fontSize:12, fill:'white', listening:false });
                const sector = new Konva.Line({ fill:'rgba(255,165,0,0.2)', stroke:'orange', strokeWidth:1, closed:true, listening:false });
                const warn = new Konva.Circle({ x:c.x+10, y:c.y-10, radius:5, fill:'red', visible:false, listening:false });
                layer.add(sector); layer.add(circle); layer.add(text); layer.add(warn);
                const cam = { id:genId(), circle, text, sector, angle:c.angle, direction:c.direction, warning:warn, name:c.name, price:c.price||0 };
                updateCameraSector(cam);
                cameras.push(cam);
                circle.on('dragmove', () => {
                    text.position({ x:circle.x()-6, y:circle.y()-7 });
                    warn.position({ x:circle.x()+10, y:circle.y()-10 });
                    updateCameraSector(cam);
                    updateAllCables();
                    layer.batchDraw(); updateSidebar();
                });
                circle.on('click', () => { selectedObject = {type:'camera', idx:cameras.indexOf(cam)}; updateSidebar(); });
            });
            state.switches.forEach(s => {
                const rect = new Konva.Rect({ x:s.x-20, y:s.y-10, width:40, height:20, fill:'#2ecc71', stroke:'#fff', strokeWidth:2, draggable:true });
                const text = new Konva.Text({ x:s.x-12, y:s.y-7, text:'SW'+(switches.length+1), fontSize:11, fill:'white', listening:false });
                layer.add(rect); layer.add(text);
                switches.push({ id:genId(), rect, text });
                rect.on('dragmove', () => { text.position({ x:rect.x()+8, y:rect.y()+3 }); updateAllCables(); layer.batchDraw(); updateSidebar(); });
            });
            state.nvrs.forEach(n => {
                const rect = new Konva.Rect({ x:n.x-25, y:n.y-15, width:50, height:30, fill:'#f39c12', stroke:'#fff', strokeWidth:2, draggable:true });
                const text = new Konva.Text({ x:n.x-15, y:n.y-8, text:'NVR', fontSize:12, fill:'white', listening:false });
                layer.add(rect); layer.add(text);
                nvrs.push({ id:genId(), rect, text });
                rect.on('dragmove', () => { text.position({ x:rect.x()+8, y:rect.y()+8 }); updateAllCables(); layer.batchDraw(); updateSidebar(); });
            });
            state.cables.forEach(c => {
                const line = new Konva.Line({ stroke:'#e74c3c', strokeWidth:2 });
                const cableObj = { id:genId(), line, from:c.from, to:c.to, path:c.path||[], lift:c.lift||0 };
                updateCable(cableObj);
                layer.add(line);
                cables.push(cableObj);
                line.on('dblclick', (ev) => {
                    const mp = stage.getPointerPosition();
                    const height = prompt('Добавить точку:\nВведите высоту подъёма (м) для этой точки (0 - без подъёма):', '0');
                    if (height !== null) {
                        const h = parseFloat(height) || 0;
                        cableObj.path.push({x:mp.x, y:mp.y, height:h});
                        if (h > 0) cableObj.lift = (cableObj.lift||0) + h;
                        updateCable(cableObj);
                        layer.draw(); updateSidebar();
                    }
                });
            });
            updateAllCables(); layer.draw(); updateSidebar();
        });

        // Экспорт КП
        document.getElementById('exportBtn').addEventListener('click', () => {
            let totalPrice = cameras.reduce((sum, c) => sum + (c.price||0), 0);
            let html = `<html><head><meta charset="utf-8"><title>КП</title></head><body>
                <h1>Коммерческое предложение</h1>
                <p>Разработка: Симанов Максим Александрович, тел. 89957886668, studio817.ru</p>
                <table border="1" cellpadding="5" cellspacing="0">
                <tr><th>Оборудование</th><th>Кол-во</th><th>Цена (руб)</th><th>Сумма (руб)</th></tr>
                <tr><td>Камеры</td><td>${cameras.length}</td><td>${cameras.length ? (cameras[0].price||0) : 0}</td><td>${totalPrice}</td></tr>
                <tr><td>Свитчи</td><td>${switches.length}</td><td></td><td></td></tr>
                <tr><td>Видеорегистраторы</td><td>${nvrs.length}</td><td></td><td></td></tr>
                <tr><td colspan="4">Общая длина кабеля: ${document.getElementById('analysisText').innerHTML.match(/<b>([^<]+)<\/b>/)?.[1] || '—'} м</td></tr>
                </table></body></html>`;
            const win = window.open('', '_blank');
            win.document.write(html); win.document.close(); win.print();
        });

        // Импорт прайс-листа
        document.getElementById('priceFileInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                const text = ev.target.result;
                const lines = text.split(/\r?\n/).filter(l => l.trim());
                priceList = [];
                lines.forEach(line => {
                    const parts = line.split(/[;,]/);
                    if (parts.length >= 3) {
                        priceList.push({ article: parts[0].trim(), name: parts[1].trim(), price: parseFloat(parts[2]) || 0 });
                    }
                });
                document.getElementById('priceStatus').textContent = `Загружено позиций: ${priceList.length}`;
                updateSidebar();
            };
            reader.readAsText(file);
        });

        // Инициализация
        buildToolbar();
        setActiveTool('select');
        updateSidebar();
    })();
</script>
</body>
</html>

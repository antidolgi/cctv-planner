<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Видео Помощник – Прототип</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; display: flex; height: 100vh; overflow: hidden; }
    .sidebar { width: 280px; background: #1e293b; padding: 15px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
    .sidebar h3 { color: #38bdf8; margin-bottom: 5px; }
    button, .upload-btn { background: #334155; color: #fff; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 14px; transition: background 0.2s; }
    button:hover, .upload-btn:hover { background: #475569; }
    button.active { background: #38bdf8; color: #000; font-weight: bold; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 5px; }
    .canvas-container { flex: 1; position: relative; background: #0a0f1a; overflow: hidden; }
    canvas { display: block; cursor: grab; }
    canvas:active { cursor: grabbing; }
    .equipment-select { width: 100%; padding: 6px; background: #334155; color: #fff; border: 1px solid #475569; border-radius: 4px; }
    .property-panel { background: #1e293b; padding: 12px; border-radius: 8px; font-size: 14px; }
    input[type="file"] { display: none; }
    .fake-link { color: #38bdf8; cursor: pointer; text-decoration: underline; }
    #cameraCount { width: 60px; padding: 4px; background: #334155; color: #fff; border: 1px solid #475569; border-radius: 4px; text-align: center; }
    .ai-response { background: #0f172a; border: 1px solid #38bdf8; border-radius: 8px; padding: 10px; max-height: 200px; overflow-y: auto; font-size: 13px; white-space: pre-wrap; }
  </style>
</head>
<body>
<div class="sidebar">
  <h3>🔧 Инструменты</h3>
  <div class="toolbar">
    <button id="toolSelect" class="active">🖱️ Выбрать</button>
    <button id="toolWall">🧱 Стена</button>
    <button id="toolCamera">📷 Камера</button>
  </div>
  <label>Камер за раз: <input id="cameraCount" type="number" value="1" min="1" max="10"></label>

  <h3>📦 Оборудование (CSV)</h3>
  <label for="csvUpload" class="upload-btn">📂 Загрузить прайс-лист</label>
  <input type="file" id="csvUpload" accept=".csv">
  <div id="csvStatus" style="font-size:12px; color:#94a3b8;"></div>
  <select id="equipmentSelect" class="equipment-select">
    <option value="">-- Сначала загрузите CSV --</option>
  </select>

  <div class="property-panel" id="propertyPanel">
    <strong>📋 Свойства</strong>
    <div id="propContent">Выберите объект на плане</div>
  </div>

  <button id="saveBtn">💾 Сохранить проект</button>
  <button id="loadBtn">📂 Загрузить проект</button>
  <button id="aiAuditBtn">🤖 AI-аудит (симуляция)</button>
</div>

<div class="canvas-container">
  <canvas id="mainCanvas"></canvas>
</div>

<script>
(function() {
  const canvas = document.getElementById('mainCanvas');
  const ctx = canvas.getContext('2d');

  // Размеры
  canvas.width = window.innerWidth - 280;
  canvas.height = window.innerHeight;

  window.addEventListener('resize', () => {
    canvas.width = window.innerWidth - 280;
    canvas.height = window.innerHeight;
    drawAll();
  });

  // Состояние
  let zoom = 1;
  let panX = 0, panY = 0;
  let isPanning = false, panStart = { x: 0, y: 0 };

  let currentTool = 'select'; // 'select', 'wall', 'camera'
  let walls = [];             // [{x1,y1,x2,y2}]
  let cameras = [];          // [{id, article, x, y, angle, mount}]
  let equipment = [];        // [{article, name, category, angle_h, angle_v, resolution, mount, price}]
  let selectedObject = null; // {type: 'camera'|'wall', index}
  let wallDrawing = null;    // временная стена при рисовании

  // UI элементы
  const toolSelect = document.getElementById('toolSelect');
  const toolWall = document.getElementById('toolWall');
  const toolCamera = document.getElementById('toolCamera');
  const cameraCountInput = document.getElementById('cameraCount');
  const equipmentSelect = document.getElementById('equipmentSelect');
  const propContent = document.getElementById('propContent');
  const csvStatus = document.getElementById('csvStatus');
  const aiAuditBtn = document.getElementById('aiAuditBtn');

  // Переключение инструментов
  toolSelect.addEventListener('click', () => setTool('select'));
  toolWall.addEventListener('click', () => setTool('wall'));
  toolCamera.addEventListener('click', () => setTool('camera'));

  function setTool(tool) {
    currentTool = tool;
    toolSelect.classList.toggle('active', tool === 'select');
    toolWall.classList.toggle('active', tool === 'wall');
    toolCamera.classList.toggle('active', tool === 'camera');
    wallDrawing = null;
    selectedObject = null;
    updatePropertyPanel();
    drawAll();
  }

  // Загрузка CSV
  document.getElementById('csvUpload').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(ev) {
      try {
        const text = ev.target.result;
        const lines = text.split(/\r?\n/).filter(l => l.trim());
        if (lines.length < 2) throw new Error('Пустой файл');
        const headers = lines[0].split(',').map(h => h.trim().toLowerCase());
        const articleIdx = headers.indexOf('article');
        const nameIdx = headers.indexOf('name');
        const categoryIdx = headers.indexOf('category');
        const angleHIdx = headers.indexOf('angle_h');
        const angleVIdx = headers.indexOf('angle_v');
        const resolutionIdx = headers.indexOf('resolution');
        const mountIdx = headers.indexOf('mount');
        const priceIdx = headers.indexOf('price');

        if (articleIdx === -1 || nameIdx === -1 || angleHIdx === -1) {
          throw new Error('CSV должен содержать поля: article, name, angle_h');
        }

        equipment = [];
        for (let i = 1; i < lines.length; i++) {
          const cols = lines[i].split(',').map(c => c.trim());
          if (cols.length < angleHIdx+1) continue;
          equipment.push({
            article: cols[articleIdx],
            name: cols[nameIdx],
            category: cols[categoryIdx] || 'camera',
            angle_h: parseFloat(cols[angleHIdx]) || 90,
            angle_v: cols[angleVIdx] ? parseFloat(cols[angleVIdx]) : null,
            resolution: cols[resolutionIdx] || 'неизвестно',
            mount: cols[mountIdx] || 'wall',
            price: cols[priceIdx] ? parseFloat(cols[priceIdx]) : null
          });
        }

        updateEquipmentSelect();
        csvStatus.textContent = `Загружено ${equipment.length} позиций`;
      } catch (err) {
        alert('Ошибка CSV: ' + err.message);
        csvStatus.textContent = 'Ошибка загрузки';
      }
    };
    reader.readAsText(file);
  });

  function updateEquipmentSelect() {
    equipmentSelect.innerHTML = '<option value="">-- Выберите камеру --</option>';
    equipment.forEach((eq, idx) => {
      if (eq.category === 'camera' || !eq.category) {
        const opt = document.createElement('option');
        opt.value = idx;
        opt.textContent = `${eq.article} - ${eq.name} (${eq.angle_h}°)`;
        equipmentSelect.appendChild(opt);
      }
    });
  }

  // Выбор оборудования для инструмента Камера
  function getSelectedEquipment() {
    const idx = equipmentSelect.value;
    if (idx === '') return null;
    return equipment[parseInt(idx)];
  }

  // Отрисовка
  function drawAll() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.save();
    ctx.translate(panX, panY);
    ctx.scale(zoom, zoom);

    drawGrid();
    drawWalls();
    drawCameras();

    if (wallDrawing) {
      ctx.strokeStyle = '#fbbf24';
      ctx.lineWidth = 2 / zoom;
      ctx.beginPath();
      ctx.moveTo(wallDrawing.x1, wallDrawing.y1);
      ctx.lineTo(wallDrawing.x2, wallDrawing.y2);
      ctx.stroke();
    }

    ctx.restore();
  }

  function drawGrid() {
    const baseGrid = 20;
    const startX = -panX / zoom;
    const startY = -panY / zoom;
    const endX = startX + canvas.width / zoom;
    const endY = startY + canvas.height / zoom;

    ctx.strokeStyle = '#1e293b';
    ctx.lineWidth = 0.5 / zoom;

    for (let x = Math.floor(startX / baseGrid) * baseGrid; x <= endX; x += baseGrid) {
      ctx.beginPath();
      ctx.moveTo(x, startY);
      ctx.lineTo(x, endY);
      ctx.stroke();
    }
    for (let y = Math.floor(startY / baseGrid) * baseGrid; y <= endY; y += baseGrid) {
      ctx.beginPath();
      ctx.moveTo(startX, y);
      ctx.lineTo(endX, y);
      ctx.stroke();
    }
  }

  function drawWalls() {
    ctx.strokeStyle = '#94a3b8';
    ctx.lineWidth = 3 / zoom;
    walls.forEach((w, idx) => {
      if (selectedObject && selectedObject.type === 'wall' && selectedObject.index === idx) {
        ctx.strokeStyle = '#38bdf8';
      } else {
        ctx.strokeStyle = '#94a3b8';
      }
      ctx.beginPath();
      ctx.moveTo(w.x1, w.y1);
      ctx.lineTo(w.x2, w.y2);
      ctx.stroke();
    });
  }

  function drawCameras() {
    cameras.forEach((cam, idx) => {
      const eq = equipment.find(e => e.article === cam.article);
      const angleH = eq ? eq.angle_h : 70;
      const radius = 150; // условная дальность видимости
      const radAngle = (cam.angle - 90) * Math.PI / 180;  // чтобы 0 = вправо
      const halfAngle = (angleH / 2) * Math.PI / 180;

      ctx.save();
      ctx.translate(cam.x, cam.y);

      // Сектор обзора
      ctx.fillStyle = 'rgba(56, 189, 248, 0.15)';
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, radius, radAngle - halfAngle, radAngle + halfAngle);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 1 / zoom;
      ctx.stroke();

      // Иконка камеры
      ctx.fillStyle = '#38bdf8';
      ctx.beginPath();
      ctx.arc(0, 0, 6 / zoom, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 1 / zoom;
      ctx.stroke();

      if (selectedObject && selectedObject.type === 'camera' && selectedObject.index === idx) {
        ctx.strokeStyle = '#fbbf24';
        ctx.lineWidth = 2 / zoom;
        ctx.beginPath();
        ctx.arc(0, 0, 10 / zoom, 0, Math.PI*2);
        ctx.stroke();
      }

      ctx.restore();
    });
  }

  // Конвертация координат мыши в логические
  function toLogical(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const mx = clientX - rect.left;
    const my = clientY - rect.top;
    return {
      x: (mx - panX) / zoom,
      y: (my - panY) / zoom
    };
  }

  // Поиск объекта под мышью
  function findObjectAt(logX, logY) {
    // Камеры
    for (let i = cameras.length - 1; i >= 0; i--) {
      const c = cameras[i];
      const dx = logX - c.x;
      const dy = logY - c.y;
      if (Math.sqrt(dx*dx+dy*dy) < 12 / zoom) {
        return { type: 'camera', index: i };
      }
    }
    // Стены
    for (let i = 0; i < walls.length; i++) {
      const w = walls[i];
      const dist = distanceToSegment(logX, logY, w.x1, w.y1, w.x2, w.y2);
      if (dist < 8 / zoom) {
        return { type: 'wall', index: i };
      }
    }
    return null;
  }

  function distanceToSegment(px, py, x1, y1, x2, y2) {
    const vx = x2 - x1;
    const vy = y2 - y1;
    const wx = px - x1;
    const wy = py - y1;
    const c1 = vx * wx + vy * wy;
    if (c1 <= 0) return Math.sqrt(wx*wx + wy*wy);
    const c2 = vx*vx + vy*vy;
    if (c2 <= c1) return Math.sqrt((px-x2)*(px-x2) + (py-y2)*(py-y2));
    const b = c1 / c2;
    const projx = x1 + b * vx;
    const projy = y1 + b * vy;
    return Math.sqrt((px-projx)*(px-projx) + (py-projy)*(py-projy));
  }

  function updatePropertyPanel() {
    if (!selectedObject) {
      propContent.innerHTML = 'Выберите объект на плане';
      return;
    }
    if (selectedObject.type === 'camera') {
      const cam = cameras[selectedObject.index];
      const eq = equipment.find(e => e.article === cam.article);
      propContent.innerHTML = `
        <b>Камера</b><br>
        Артикул: ${cam.article}<br>
        ${eq ? 'Название: ' + eq.name + '<br>' : ''}
        Угол обзора: ${eq ? eq.angle_h + '°' : 'не задан'}<br>
        Разрешение: ${eq ? eq.resolution : '-'}<br>
        Крепление: ${cam.mount || (eq ? eq.mount : '-')}<br>
        Координаты: (${Math.round(cam.x)}, ${Math.round(cam.y)})<br>
        Направление: ${cam.angle}°
      `;
    } else if (selectedObject.type === 'wall') {
      const w = walls[selectedObject.index];
      const len = Math.sqrt((w.x2-w.x1)**2 + (w.y2-w.y1)**2);
      propContent.innerHTML = `
        <b>Стена</b><br>
        Длина: ${Math.round(len)} пикс<br>
        От (${Math.round(w.x1)},${Math.round(w.y1)}) до (${Math.round(w.x2)},${Math.round(w.y2)})
      `;
    }
  }

  // Обработчики мыши
  canvas.addEventListener('mousedown', (e) => {
    const pos = toLogical(e.clientX, e.clientY);

    if (currentTool === 'select') {
      const obj = findObjectAt(pos.x, pos.y);
      if (obj) {
        selectedObject = obj;
        updatePropertyPanel();
        drawAll();
        return;
      }
      // начало панорамирования
      isPanning = true;
      panStart = { x: e.clientX - panX, y: e.clientY - panY };
      canvas.style.cursor = 'grabbing';
    }
    else if (currentTool === 'wall') {
      wallDrawing = { x1: pos.x, y1: pos.y, x2: pos.x, y2: pos.y };
    }
    else if (currentTool === 'camera') {
      const eq = getSelectedEquipment();
      if (!eq) {
        alert('Сначала выберите камеру из прайс-листа!');
        return;
      }
      const count = parseInt(cameraCountInput.value) || 1;
      const spacing = 30;
      for (let i = 0; i < count; i++) {
        cameras.push({
          id: Date.now() + i,
          article: eq.article,
          x: pos.x + i * spacing,
          y: pos.y,
          angle: 0,   // по умолчанию вправо
          mount: eq.mount || 'wall'
        });
      }
      drawAll();
    }
  });

  window.addEventListener('mousemove', (e) => {
    if (isPanning) {
      panX = e.clientX - panStart.x;
      panY = e.clientY - panStart.y;
      drawAll();
    }
    if (currentTool === 'wall' && wallDrawing) {
      const pos = toLogical(e.clientX, e.clientY);
      wallDrawing.x2 = pos.x;
      wallDrawing.y2 = pos.y;
      drawAll();
    }
  });

  window.addEventListener('mouseup', (e) => {
    if (isPanning) {
      isPanning = false;
      canvas.style.cursor = 'grab';
    }
    if (currentTool === 'wall' && wallDrawing) {
      const pos = toLogical(e.clientX, e.clientY);
      if (Math.abs(pos.x - wallDrawing.x1) > 5 || Math.abs(pos.y - wallDrawing.y1) > 5) {
        walls.push({
          x1: wallDrawing.x1, y1: wallDrawing.y1,
          x2: pos.x, y2: pos.y
        });
      }
      wallDrawing = null;
      drawAll();
    }
  });

  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    const zoomFactor = 0.1;
    const oldZoom = zoom;
    if (e.deltaY < 0) zoom *= 1 + zoomFactor;
    else zoom /= 1 + zoomFactor;
    zoom = Math.min(Math.max(0.2, zoom), 5);

    const rect = canvas.getBoundingClientRect();
    const mouseX = e.clientX - rect.left;
    const mouseY = e.clientY - rect.top;
    panX = mouseX - (mouseX - panX) * (zoom / oldZoom);
    panY = mouseY - (mouseY - panY) * (zoom / oldZoom);
    drawAll();
  });

  // Сохранение и загрузка
  document.getElementById('saveBtn').addEventListener('click', () => {
    const data = { walls, cameras, equipment };
    const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'project.json';
    a.click();
  });

  document.getElementById('loadBtn').addEventListener('click', () => {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json';
    input.onchange = (e) => {
      const file = e.target.files[0];
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const data = JSON.parse(ev.target.result);
          walls = data.walls || [];
          cameras = data.cameras || [];
          if (data.equipment) {
            equipment = data.equipment;
            updateEquipmentSelect();
          }
          selectedObject = null;
          updatePropertyPanel();
          drawAll();
        } catch (err) { alert('Ошибка файла проекта'); }
      };
      reader.readAsText(file);
    };
    input.click();
  });

  // AI-аудит (симуляция)
  aiAuditBtn.addEventListener('click', () => {
    if (cameras.length === 0) {
      alert('Добавьте хотя бы одну камеру');
      return;
    }
    // Симулируем ответ ИИ
    const response = `[AI-аудит] Проанализировано камер: ${cameras.length}
Обнаружена слепая зона в углу помещения (перекройте камерой с углом > 90°).
Пиксельная плотность для распознавания лиц достаточна (120 px/м).
Рекомендация: переместите камеру CAM-001 на 0.5 м вправо.`;
    alert(response);
    // В реальном продукте здесь должен быть запрос к DeepSeek
  });

  // Начальная отрисовка
  drawAll();
})();
</script>
</body>
</html>
